# Hasura CLI project config — required for nhost's deploy pipeline to
# run `hasura migrate apply` / `metadata apply` against nhost/migrations
# and nhost/metadata (it validates the current directory has this file
# before running). Endpoint/admin secret are supplied by nhost's own
# deploy tooling at run time, not hardcoded here.
version: 3
metadata_directory: metadata
migrations_directory: migrations
actions:
  kind: synchronous
  handler_webhook_baseurl: http://localhost:3000
