    - role: owner
      permission:
        columns: [id, org_id, user_id, role, created_at]
        filter:
          organization:
            org_members:
              user_id: { _eq: X-Hasura-User-Id }
    - role: editor
      permission:
        columns: [id, org_id, user_id, role, created_at]
        filter:
          organization:
            org_members:
              user_id: { _eq: X-Hasura-User-Id }
    - role: viewer
