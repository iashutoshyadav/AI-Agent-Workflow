
- table:
    schema: public
    name: organizations
  object_relationships:
    - name: usage_stats
      using:
        manual_configuration:
          remote_table:
            schema: public
            name: org_usage_stats
          column_mapping:
            id: org_id
  array_relationships:
    - name: org_members
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: org_members
    - name: workflows
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: workflows
  select_permissions:
    - role: owner
      permission:
        columns: [id, name, quota_calls_allowed, quota_calls_used, quota_period_start, created_at]
        filter:
          org_members:
            user_id: { _eq: X-Hasura-User-Id }
    - role: editor
      permission:
        columns: [id, name, quota_calls_allowed, quota_calls_used, quota_period_start, created_at]
        filter:
          org_members:
            user_id: { _eq: X-Hasura-User-Id }
    - role: viewer
      permission:
        columns: [id, name, quota_calls_allowed, quota_calls_used, quota_period_start, created_at]
        filter:
          org_members:
            user_id: { _eq: X-Hasura-User-Id }
    - role: user
      permission:
        columns: [id, name, quota_calls_allowed, quota_calls_used, quota_period_start, created_at]
        filter:
          org_members:
            user_id: { _eq: X-Hasura-User-Id }

