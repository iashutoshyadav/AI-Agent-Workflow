        columns: [id, org_id, user_id, role, created_at]
        filter:
          organization:
            org_members:
              user_id: { _eq: X-Hasura-User-Id }
  insert_permissions:
    - role: owner
      permission:
        check:
          organization:
            org_members:
              user_id: { _eq: X-Hasura-User-Id }
