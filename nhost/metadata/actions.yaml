
actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: "https://biqeamemplmttivvhajp.functions.ap-south-1.nhost.run/v1/trigger-workflow-run"
      forward_client_headers: true
      type: mutation
    permissions:
      - role: owner
      - role: editor
    comment: Starts a workflow run after checking role and quota.

  - name: approveStep
    definition:
      kind: synchronous
      handler: "https://biqeamemplmttivvhajp.functions.ap-south-1.nhost.run/v1/approve-step"
      forward_client_headers: true
      type: mutation
    permissions:
      - role: owner
      - role: editor
    comment: Approves or rejects a paused approval_gate step and resumes the run.

  - name: createOrganization
    definition:
      kind: synchronous
      handler: "https://biqeamemplmttivvhajp.functions.ap-south-1.nhost.run/v1/create-organization"
      forward_client_headers: true
      type: mutation
    permissions:
      - role: user
      - role: owner
      - role: editor
      - role: viewer
    comment: Creates a new organization and adds the caller as its owner.

custom_types:
  enums: []
  input_objects: []
  objects:
    - name: TriggerWorkflowRunOutput
      fields:
        - name: workflow_run_id
          type: uuid!
        - name: status
          type: String!
    - name: ApproveStepOutput
      fields:
        - name: step_run_id
          type: uuid!
        - name: workflow_run_id
          type: uuid!
        - name: status
          type: String!
    - name: CreateOrganizationOutput
      fields:
        - name: org_id
          type: uuid!
  scalars: []
