# Hasura Actions — the core of the assignment.
#
# `permissions:` below is a coarse, role-header gate (viewer can never
# even call triggerWorkflowRun/approveStep). The REAL authorization —
# "is this user actually owner/editor in THIS workflow's org, right
# now" — is re-derived inside the handler from x-hasura-user-id against
# org_members with the admin secret, never trusted from the client's
# X-Hasura-Role header. See functions/lib/auth.ts.

actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: "https://biqeamemplmttivvhajp.functions.ap-south-1.nhost.run/v1/trigger-workflow-run"
      forward_client_headers: true
      headers:
        - name: x-hasura-admin-secret
          value_from_env: HASURA_GRAPHQL_ADMIN_SECRET
      type: mutation
    permissions:
      - role: owner
      - role: editor
    comment: >-
      Verifies caller is owner/editor in the workflow's org, checks org
      quota, creates workflow_run, executes steps in order (llm_call,
      http_request, db_write, conditional_branch, notify, approval_gate),
      pausing on approval_gate. Increments quota usage on completion.

  - name: approveStep
    definition:
      kind: synchronous
      handler: "https://biqeamemplmttivvhajp.functions.ap-south-1.nhost.run/v1/approve-step"
      forward_client_headers: true
      headers:
        - name: x-hasura-admin-secret
          value_from_env: HASURA_GRAPHQL_ADMIN_SECRET
      type: mutation
    permissions:
      - role: owner
      - role: editor
    comment: >-
      Checks the approver is owner/editor in the approval_gate step's
      org (fresh DB lookup, not the session role claim), then marks the
      step approved/rejected and resumes execution of the remaining
      steps in that workflow_run.

  - name: createOrganization
    definition:
      kind: synchronous
      handler: "https://biqeamemplmttivvhajp.functions.ap-south-1.nhost.run/v1/create-organization"
      forward_client_headers: true
      headers:
        - name: x-hasura-admin-secret
          value_from_env: HASURA_GRAPHQL_ADMIN_SECRET
      type: mutation
    permissions:
      - role: user
      - role: owner
      - role: editor
      - role: viewer
    comment: >-
      Bootstraps a brand new org + inserts the caller as its first
      owner, in one transaction. Not one of the graded step types, but
      needed to get from "freshly signed-up user" to "org owner" without
      a chicken-and-egg org_members insert permission problem.

custom_types:
  enums: []
  input_objects: []
  objects:
    - name: TriggerWorkflowRunOutput
      fields:
        - name: workflow_run_id
          type: uuid!
        - name: status
          type: String!
    - name: ApproveStepOutput
      fields:
        - name: step_run_id
          type: uuid!
        - name: workflow_run_id
          type: uuid!
        - name: status
          type: String!
    - name: CreateOrganizationOutput
      fields:
        - name: org_id
          type: uuid!
  scalars: []
